[package]
name = "seraphtube"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["macos-private-api"] }  # transparent window + vibrancy
tauri-plugin-opener = "2"   # open external links and the themes folder in the default handler
serde = { version = "1", features = ["derive"] }
serde_json = "1"            # settings file + WebKit rule JSON
ureq = "2"                  # tiny blocking HTTPS client for list updates (no async runtime needed)

[target.'cfg(target_os = "macos")'.dependencies]
# Needed because Tauri doesn't expose WKContentRuleList: this is the native network-blocking path.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"


[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK content filters use the same declarative JSON format as WKContentRuleList.
webkit2gtk = { version = "=2.0.2", features = ["v2_24"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
