name: "Publish Release"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            appPath: "src-tauri/target/release/bundle/dmg/*.dmg"
          - platform: windows-latest
            appPath: "src-tauri/target/release/bundle/nsis/*.exe"
          - platform: ubuntu-22_04
            appPath: "src-tauri/target/release/bundle/deb/*.deb"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22_04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build and Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Seraphtube ${{ github.ref_name }}"
          releaseBody: "Automated desktop release for Windows, macOS, and Linux."
          releaseDraft: false
          prerelease: false
          workspacedir: src-tauri
          projectPath: src-tauri
          args: ""
